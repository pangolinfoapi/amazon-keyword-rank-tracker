name: Daily rank check

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC every day
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write # let the bot commit data/reports back to this repo

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check rankings and build report
        env:
          PANGOLIN_TOKEN: ${{ secrets.PANGOLIN_TOKEN }}
        run: |
          python rank_tracker.py run
          python rank_tracker.py report

      - name: Commit results
        run: |
          git config user.name "rank-bot"
          git config user.email "rank-bot@users.noreply.github.com"
          git add data/ reports/
          git commit -m "chore: daily rank update $(date -u +%F)" || echo "no changes"
          git push
